
name: PS5 Pro Stock Check

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ps5-stock-check
  cancel-in-progress: false

jobs:
  check-stock:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Download repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: python -m pip install requests beautifulsoup4

      - name: Check stores
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py

      - name: Save latest status
        run: |
          git config user.name "PS5 Stock Bot"
          git config user.email "stock-bot@users.noreply.github.com"
          git add state.json

          if ! git diff --cached --quiet; then
            git commit -m "Update stock status"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "Ingen statusændringer at gemme."
          fi
